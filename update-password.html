<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Choose New Password | Hot Flash</title>
    <meta name="description" content="Choose a new password for your Hot Flash account." />
    <link rel="icon" type="image/png" href="assets/hot-flash-logo.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="styles.css" />
    <link rel="stylesheet" href="app-pages.css" />
  </head>
  <body class="app-page">
    <header class="site-header">
      <a class="brand" href="index.html" aria-label="Hot Flash home">
        <img class="brand-logo" src="assets/hot-flash-logo.png" alt="" />
        <span>Hot Flash</span>
      </a>
    </header>

    <main class="app-shell">
      <section class="app-hero">
        <div class="app-panel">
          <p class="eyebrow">Account Recovery</p>
          <h1>Choose a fresh password.</h1>
          <p>Use at least eight characters and make it something you haven’t used elsewhere.</p>
        </div>

        <form class="app-card form-grid" action="javascript:void(0)" data-password-update-form>
          <p class="eyebrow">New Password</p>
          <label><span>New password</span><input type="password" name="password" autocomplete="new-password" minlength="8" required /></label>
          <label><span>Confirm password</span><input type="password" name="password_confirmation" autocomplete="new-password" minlength="8" required /></label>
          <button type="submit" disabled>Update Password</button>
          <p class="small-muted" data-auth-status>Checking your reset link…</p>
          <a class="small-muted" href="forgot-password.html">Request another reset link</a>
        </form>
      </section>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="supabase-config.js?v=6"></script>
    <script src="auth-errors.js?v=1"></script>
    <script src="auth-recovery.js?v=1"></script>
  </body>
</html>
