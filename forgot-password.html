<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Reset Password | Hot Flash</title>
    <meta name="description" content="Request a password reset for your Hot Flash account." />
    <link rel="icon" type="image/png" href="assets/hot-flash-logo.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="styles.css" />
    <link rel="stylesheet" href="app-pages.css" />
  </head>
  <body class="app-page">
    <header class="site-header">
      <a class="brand" href="index.html" aria-label="Hot Flash home">
        <img class="brand-logo" src="assets/hot-flash-logo.png" alt="" />
        <span>Hot Flash</span>
      </a>
      <nav aria-label="Primary navigation">
        <a href="login.html">Login</a>
        <a href="signup.html">Sign Up</a>
      </nav>
    </header>

    <main class="app-shell">
      <section class="app-hero">
        <div class="app-panel">
          <p class="eyebrow">Account Recovery</p>
          <h1>Get back in the garage.</h1>
          <p>Enter the email address connected to your account and we’ll send you a secure reset link.</p>
        </div>

        <form class="app-card form-grid" action="javascript:void(0)" data-recovery-request-form>
          <p class="eyebrow">Reset Password</p>
          <label><span>Email</span><input type="email" name="email" autocomplete="email" placeholder="you@example.com" required /></label>
          <button type="submit">Send Reset Link</button>
          <p class="small-muted" data-auth-status>Ready when you are.</p>
          <a class="small-muted" href="login.html">Back to login</a>
        </form>
      </section>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="supabase-config.js?v=6"></script>
    <script src="auth-errors.js?v=1"></script>
    <script src="auth-recovery.js?v=1"></script>
  </body>
</html>
