<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex" />
    <title>Opening profile | Hot Flash</title>
    <link rel="icon" type="image/png" href="assets/hot-flash-logo.png" />
    <link rel="stylesheet" href="styles.css" />
    <link rel="stylesheet" href="app-pages.css" />
    <script>
      (() => {
        const params = new URLSearchParams(window.location.search);
        const destination = params.has('u') || params.has('id')
          ? `member.html?${params.toString()}`
          : 'dashboard.html';
        window.location.replace(destination);
      })();
    </script>
  </head>
  <body class="app-page">
    <main class="app-shell">
      <section class="app-panel">
        <p class="eyebrow">Hot Flash</p>
        <h1>Opening the right profile…</h1>
        <p class="small-muted">This older profile link has moved.</p>
        <div class="inline-actions">
          <a class="secondary-button" href="dashboard.html">Go to My Garage</a>
          <a class="secondary-button" href="feed.html">Go to Discover</a>
        </div>
      </section>
    </main>
  </body>
</html>
