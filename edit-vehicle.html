<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Edit Vehicle | Hot Flash</title><meta name="description" content="Update your Hot Flash vehicle profile, build details, cover image, and gallery."><link rel="icon" type="image/png" href="assets/hot-flash-logo.png"><link rel="stylesheet" href="styles.css"><link rel="stylesheet" href="app-pages.css"><link rel="stylesheet" href="hotflash-ui-v2.css?v=1"><link rel="stylesheet" href="social.css?v=1"><link rel="stylesheet" href="garage-polish.css?v=1"></head><body class="app-page" data-page="edit-vehicle"><header class="site-header"><a class="brand" href="index.html"><img class="brand-logo" src="assets/hot-flash-logo.png" alt=""><span>Hot Flash</span></a><nav><a href="feed.html">Discover</a><a href="dashboard.html">My Garage</a></nav></header><main class="app-shell"><p class="small-muted" data-edit-status role="status" aria-live="polite">Loading vehicle…</p><form class="app-card form-grid two" data-edit-vehicle-form hidden><div class="full-span"><p class="eyebrow">Owner tools</p><h1>Edit vehicle</h1><p class="small-muted">Keep the permanent vehicle identity accurate while the build evolves.</p></div><label><span>Vehicle type</span><select name="vehicle_type"><option value="automobile">Car / truck</option><option value="motorcycle">Motorcycle</option><option value="marine">Marine / watercraft</option><option value="offroad">Off-road / powersports</option><option value="other">Other</option></select></label><label><span>Nickname</span><input name="nickname" minlength="1" maxlength="80" autocomplete="off" required></label><label><span>Year</span><input name="year" type="number" min="1885" max="2100" inputmode="numeric" required></label><label><span>Make</span><input name="make" maxlength="80" autocomplete="off" required></label><label><span>Model</span><input name="model" maxlength="80" autocomplete="off" required></label><label><span>Trim</span><input name="trim" maxlength="100" autocomplete="off"></label><label><span>Horsepower</span><input name="horsepower" type="number" min="0" max="100000" inputmode="numeric"></label><label><span>Vehicle anniversary</span><input name="anniversary_date" type="date"><small>The date this ride became part of your story.</small></label><label class="full-span"><span>What's done to it?</span><textarea name="build_summary" maxlength="5000"></textarea></label><label class="full-span"><span>Powertrain</span><textarea name="powertrain" maxlength="5000"></textarea></label><label class="full-span"><span>Suspension, chassis & brakes</span><textarea name="suspension_brakes" maxlength="5000"></textarea></label><label class="full-span"><span>Wheels, tires, tracks or propulsion</span><textarea name="wheels_tires" maxlength="5000"></textarea></label><label class="full-span"><span>Exterior / hull / body</span><textarea name="exterior" maxlength="5000"></textarea></label><label class="full-span"><span>Interior / cockpit</span><textarea name="interior" maxlength="5000"></textarea></label><label class="full-span"><span>Electronics & audio</span><textarea name="electronics_audio" maxlength="5000"></textarea></label><div class="full-span soundtrack-editor"><p class="eyebrow">Garage Soundtrack</p><label><span>Song title / artist</span><input name="music_title" maxlength="180" placeholder="The song that fits this build"></label><label><span>Spotify, YouTube or SoundCloud link</span><input name="music_url" type="url" maxlength="1000" inputmode="url" placeholder="https://..."></label></div><label class="full-span"><span>Replace cover photo</span><input name="cover_photo" type="file" accept="image/jpeg,image/png,image/webp,image/gif,image/heic,image/heif"><small>JPEG, PNG, WebP, GIF, HEIC, or HEIF · maximum 10 MB.</small></label><div class="inline-actions full-span"><button type="submit">Save vehicle</button><a class="secondary-button" data-cancel-edit href="dashboard.html">Cancel</a></div></form><section class="app-card" data-photo-manager-section hidden><p class="eyebrow">Photo manager</p><h2>Gallery photos</h2><p class="small-muted">Set a photo as the cover or permanently remove it from this vehicle.</p><div class="photo-manager-grid" data-photo-manager aria-live="polite"></div></section></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="supabase-config.js?v=8"></script><script src="auth-errors.js?v=1"></script><script src="edit-vehicle.js?v=4"></script></body></html>
